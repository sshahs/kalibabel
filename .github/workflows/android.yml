# KaliBabel CI for GitHub Actions. Mirrors .gitea/workflows/android.yml (same scripts, same signing
# key, same versionCode), so a tag produces identical APKs on GitHub and on the Gitea mirror.
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD – release signing (required for v* tags)
# Variables (optional): RELEASE_DRAFT=true, ALLOW_DEBUG_SIGNED_RELEASE=true
name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # create releases and upload assets

env:
  ANDROID_PLATFORM: "android-37.0"
  ANDROID_BUILD_TOOLS: "36.0.0"
  GRADLE_OPTS: "-Dorg.gradle.workers.max=4"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: scripts/ci/setup-android-sdk.sh

      - name: Compute version
        run: scripts/ci/version.sh

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALLOW_DEBUG_SIGNED_RELEASE: ${{ vars.ALLOW_DEBUG_SIGNED_RELEASE }}
        run: scripts/ci/decode-keystore.sh

      - name: Unit & UI render tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Assemble APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Collect outputs
        if: always()
        run: scripts/ci/collect-outputs.sh

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: kalibabel-apks
          path: dist/*.apk
          if-no-files-found: warn

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalibabel-reports
          path: reports
          if-no-files-found: ignore

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/ci/release-notes.sh

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: dist/RELEASE_NOTES.md
          DRAFT: ${{ vars.RELEASE_DRAFT }}
        run: scripts/ci/github-release.sh dist/*-release.apk dist/SHA256SUMS.txt
