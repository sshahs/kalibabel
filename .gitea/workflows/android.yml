# KaliBabel CI for Gitea Actions (act_runner).
#
# Runner requirements: an x86_64 act_runner whose `ubuntu-latest` label maps to an image with Node
# (the default `gitea/runner-images:ubuntu-latest` or `catthehacker/ubuntu:act-latest` work), ~6 GB RAM.
# Secrets (repo Settings → Actions → Secrets; create them with scripts/release-keystore.sh):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD  – release signing (required for v* tags)
#   RELEASE_TOKEN (optional) – token with write:repository if the automatic token may not create releases
# Variables (repo Settings → Actions → Variables, all optional):
#   RELEASE_DRAFT=true                – publish releases as drafts for review
#   ALLOW_DEBUG_SIGNED_RELEASE=true   – allow tag builds without signing secrets (testing only)
#
# Releases: push a tag `v*` to GitHub (or use the GitHub workflow's Run workflow → release_tag). When
# the pull mirror (https://tig.sshah.email/Cheeba/kalibabel) syncs it, Gitea fires a push event for the
# tag, this workflow builds and the APKs are attached to the release of that tag on the mirror repo.
#
# Only tags trigger this workflow (plus manual runs): every commit is already tested on GitHub, and a
# mirror sync delivers the commit and its tag as two separate push events, which would otherwise
# build the same commit twice. Requires Gitea >= 1.21.5 (older versions wipe
# releases of pull mirrors on every sync).
name: Android CI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# Releases are part of "contents". Gitea >= 1.26 honours this even when the instance defaults
# Actions tokens to "restricted"; older versions ignore it and use their (permissive) default.
permissions:
  contents: write

env:
  CMDLINE_TOOLS_VERSION: "16111833"
  ANDROID_PLATFORM: "android-37.0"
  ANDROID_BUILD_TOOLS: "36.0.0"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ~/android-sdk
          key: android-sdk-${{ env.CMDLINE_TOOLS_VERSION }}-${{ env.ANDROID_PLATFORM }}-${{ env.ANDROID_BUILD_TOOLS }}

      - name: Install Android SDK
        run: ANDROID_HOME="$HOME/android-sdk" scripts/ci/setup-android-sdk.sh

      - name: Compute version
        run: scripts/ci/version.sh

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALLOW_DEBUG_SIGNED_RELEASE: ${{ vars.ALLOW_DEBUG_SIGNED_RELEASE }}
        run: scripts/ci/decode-keystore.sh

      - name: Unit & UI render tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Assemble APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Check R8 kept reflective constructors
        run: python3 scripts/ci/check-r8-reflection.py release

      - name: Collect outputs
        if: always()
        run: scripts/ci/collect-outputs.sh

      # Gitea identifies as GHES, which upload-artifact@v4 refuses; v3 works with Gitea's artifact API.
      - name: Upload APKs
        uses: actions/upload-artifact@v3
        with:
          name: kalibabel-apks
          path: dist/*.apk
          if-no-files-found: warn

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: kalibabel-reports
          path: reports
          if-no-files-found: ignore

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/ci/release-notes.sh

      - name: Publish Gitea release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          NOTES_FILE: dist/RELEASE_NOTES.md
          DRAFT: ${{ vars.RELEASE_DRAFT }}
        run: TAG="${GITHUB_REF#refs/tags/}" scripts/ci/gitea-release.sh dist/*-release.apk dist/SHA256SUMS.txt
